<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DMMMSU Campus Notice Portal</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <div class="logo">
                <img src="4.jpg" alt="DMMMSU Official Logo">
            </div>

            <div class="school-name">
               San Julian Integrated School
            </div>
        </header>

        <!-- NAVIGATION -->
        <nav>
            <a href="#">HOME</a>
            <a href="#">ABOUT</a>
            <a href="#">CONTACT US</a>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="content">

            <!-- CAMPUS NOTICE -->
            <section class="campus-notice">

                <h2>Campus Notice</h2>

                <div class="image-container">
                    <img src="1.jpg" alt="Campus Notice 1">
                    <img src="2.jpg" alt="Campus Notice 2">
                    <img src="3.jpg" alt="Campus Notice 3">
                </div>

            </section>

            <!-- POST NOTICE FORM -->
            <section class="post-notice">

                <h2>Post Notice</h2>

                <form>

                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter notice title"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea
                            id="message"
                            name="message"
                            placeholder="Write your notice here..."
                            required
                        ></textarea>
                    </div>

                    <button type="submit">Post Notice</button>

                </form>

            </section>

        </main>

        <!-- FOOTER -->
        <footer>
            College of Computer Science
        </footer>

    </div>

</body>
</html>
